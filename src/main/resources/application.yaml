spring:
  config:
    # Локальні секрети (ключі LiqPay тощо) з файлу поруч з pom.xml; файлу може не бути
    import: optional:file:./.env.properties
  datasource:
    url: jdbc:postgresql://localhost:54321/restaurant_db
    username: vlad
    password: # залишаємо порожнім, оскільки в тебе локальний користувач macOS
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false # БД-запити лише в сервісах (@Transactional), а не під час рендеру відповіді
    hibernate:
      ddl-auto: validate # Spring сам створить таблиці в базі на основі твоїх Entity
    show-sql: true # Виводить SQL-запити в консоль (дуже корисно для відлагодження)
    properties:
      hibernate:
        format_sql: true # Робить SQL у консолі красивим і читабельним

app:
  jwt:
    # Base64-секрет для підпису JWT. У проді задається змінною оточення JWT_SECRET
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    staff-expiration-ms: 86400000   # 24 години
    guest-expiration-ms: 14400000   # 4 години
  websocket:
    # Дозволені origin-и для WebSocket (через кому). У проді вкажіть домен фронтенду
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}
  qr:
    # Адреса гостьового фронтенду, яка кодується в QR (задається змінною оточення)
    base-url: ${FRONTEND_URL:http://localhost:5173}
  liqpay:
    # Ключі з кабінету LiqPay (sandbox-ключі починаються з "sandbox_"). Без них оплата недоступна.
    public-key: ${LIQPAY_PUBLIC_KEY:}
    private-key: ${LIQPAY_PRIVATE_KEY:}
    sandbox: ${LIQPAY_SANDBOX:true}
    currency: UAH
    checkout-url: https://www.liqpay.ua/api/3/checkout
    api-url: https://www.liqpay.ua/api/request
    # Публічна адреса бекенду для server-to-server callback (локально - через ngrok). Необов'язково:
    # без неї статус платежу підтягується кнопкою/викликом POST /payments/{id}/sync
    server-callback-url: ${LIQPAY_CALLBACK_URL:}
    # Куди LiqPay повертає гостя після оплати
    result-url: ${FRONTEND_URL:http://localhost:5173}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
springdoc:
  swagger-ui:
    path: /swagger-ui.html
